error_log  /var/log/nginx/error.log;
access_log  /var/log/nginx/access.log;

upstream django {
    server unix:///var/run/app/keyform.sock; # for a file socket
    #server 127.0.0.1:8001; # for a web port socket (we'll use this first)
}

# Reject any requests that don't match our hostname
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Redirect rlskeyform to rlskeyform.missouristate.edu
server {
    server_name rlskeyform;
    return 302 $scheme://rlskeyform.missouristate.edu$request_uri;
}

# configuration of the server
server {
    # the port your site will be served on
    listen      80;
    listen      [::]:80;
    # the domain name it will serve for
    server_name rlskeyform.missouristate.edu; # substitute your machine's IP address or FQDN
    charset     utf-8;

    # max upload size
    client_max_body_size 75M;   # adjust to taste

    # Django static
    location ~ ^/static/(.*) {
        alias /projects/static/$1; # your Django project's static files - amend as required
    }

    # Finally, send all non-media requests to the Django server.
    location ~^(/.*)$ {
        # url = url_scheme + :// + HTTP_HOST + : + SERVER_PORT + SCRIPT_NAME + PATH_INFO + ? + QUERY_STRING
        uwsgi_pass  django;
        uwsgi_param  QUERY_STRING       $query_string;
        uwsgi_param  REQUEST_METHOD     $request_method;
        uwsgi_param  CONTENT_TYPE       $content_type;
        uwsgi_param  CONTENT_LENGTH     $content_length;

        uwsgi_param  REQUEST_URI        $request_uri;
        uwsgi_param  PATH_INFO          $1;
        uwsgi_param  SCRIPT_NAME        /;
        uwsgi_param  DOCUMENT_ROOT      $document_root;
        uwsgi_param  SERVER_PROTOCOL    $server_protocol;
        uwsgi_param  HTTPS              $https if_not_empty;

        uwsgi_param  REMOTE_ADDR        $remote_addr;
        uwsgi_param  REMOTE_PORT        $remote_port;
        uwsgi_param  SERVER_PORT        $server_port;
        uwsgi_param  SERVER_NAME        $server_name;
    }
}
